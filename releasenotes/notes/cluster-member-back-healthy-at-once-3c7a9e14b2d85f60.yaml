---
fixes:
  - |
    A cluster member that came back (its server started again after an
    outage) and found its cluster as it should be told nothing, and its
    guest agent sent its first heartbeat only a pass or two of the
    periodic loop after it started: the task manager counted the member
    as down until then, and the cluster was HEALTHY again only at its next
    look, 2 to 4 minutes after the member was back. The guest agent now
    sends a heartbeat as soon as it serves, and a member that starts
    normal tells it once, after that heartbeat: the cluster is looked at,
    and found healthy, then.
  - |
    The old primary of a Redis, Valkey or KeyDB cluster of the sentinel
    topology that comes back after the sentinels elected another starts
    a primary still, and only then becomes a replica: it now tells it is
    not where it should be until it is a replica, so that its cluster is
    looked at, and found healthy, when the sentinels have reconfigured it.
