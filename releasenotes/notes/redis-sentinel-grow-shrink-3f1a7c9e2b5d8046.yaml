---
features:
  - |
    A Redis, Valkey or KeyDB cluster of the sentinel topology can be
    grown and shrunk. New members join as replicas of the primary, with
    root as the others have it; a shrink keeps at least three members and
    has the sentinels elect another primary first when the primary is
    among the members that go; the sentinels' quorum follows the number
    of members. A rolling restart or upgrade takes the replicas first and
    the primary last, once the sentinels elected another.
  - |
    The common cluster framework's rolling restart and upgrade take a
    ``before_member`` hook, run before each member (a primary handing
    over, say); a cluster that grows keeps the topology and the
    properties its datastore keeps (``KEPT_PROPERTIES``) for its new
    members.
