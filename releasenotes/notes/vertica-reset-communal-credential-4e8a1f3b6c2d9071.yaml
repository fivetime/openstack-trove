---
features:
  - |
    A Vertica cluster in Eon Mode has a new action,
    ``reset_communal_credential``
    (``POST /v1.0/{project}/clusters/{id}`` with
    ``{"reset_communal_credential": {}}``, or
    ``openstack database cluster reset communal credential``). A user of the
    project of the cluster asks for it with a token of that project when the
    user whose EC2 credential the communal storage is reached with is
    deleted or leaves the project: the task manager creates an EC2 credential
    of the user asking, checks that it reaches the bucket, has the database
    take it (``ALTER DATABASE DEFAULT SET AWSAuth``, without a restart), and
    then removes the old credential. A failure leaves the old credential in
    place. Other clusters, and tokens of other projects, are refused with a
    400.
