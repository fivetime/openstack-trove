---
fixes:
  - |
    Starting the database container failed now and then with ``failed to
    set IPv6 gateway (...): file exists`` on an instance on a
    ``dhcpv6-stateful`` IPv6 subnet: the router's advertisement reached the
    container's interface before docker added the gateway's default route.
    When docker adds that route, the guest now has docker turn router
    advertisements off on the interface before it brings it up
    (``net.ipv6.conf.IFNAME.accept_ra=0``). On SLAAC and
    ``dhcpv6-stateless`` subnets the default route still comes from the
    router's advertisement.
