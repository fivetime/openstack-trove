---
features:
  - |
    A new guest option, ``[DEFAULT] user_port_driver``, chooses how the
    database container gets the user-facing port under
    ``network_isolation``. The default, ``hostnic``, is the existing
    behaviour (the port's interface is moved into the container by the
    docker-hostnic plugin). With ``ipvlan`` the interface stays in the
    guest, up and without addresses of its own, and the container gets an
    ipvlan sub-interface of it in L2 mode with the port's addresses and
    gateways: for guests whose platform owns their interfaces, such as
    system containers, which cannot be stopped while an interface is in
    another network namespace. The guest agent prepares the interface at
    its start (on systemd-networkd it marks it unmanaged).
