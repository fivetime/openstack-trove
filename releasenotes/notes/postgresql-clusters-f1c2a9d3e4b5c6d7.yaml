---
features:
  - |
    PostgreSQL clusters: a primary and its streaming standbys behind one
    endpoint for writes and one for reads, with the replication mode the
    tenant chooses (``replication_mode``: ``async``, ``sync`` or
    ``strict``, ``sync`` by default), grown and shrunk by members.
  - |
    A PostgreSQL cluster fails over by itself: the task manager gives up
    a primary that its standbys have lost and that does not answer, or
    answers that it has no standby either, promotes the standby that
    holds the most once no acknowledged commit can be lost, points the
    other standbys at it and has the old primary rejoin as a standby
    (``pg_rewind``, or a base backup). A primary cut off from its
    standbys and from the task manager's lease closes its write port by
    itself. Removing the primary switches over to a standby first. The
    standbys keep what a failover needs to know of the primary (the
    standbys it streamed to and, in async mode, where it was), so that a
    task manager that restarts meanwhile decides as safely; it also
    waits out a lease its predecessor may have granted. The standbys
    that lost the primary say which members they reach on the tenant
    network: a primary that a majority of the cluster does not reach
    there is cut off from the clients too and is replaced, in sync mode
    as well, since nothing was acknowledged while it went on alone;
    standbys that reach nobody are cut off themselves, and the primary
    keeps its lease and goes on serving.
  - |
    The task manager looks at the clusters of a datastore several at a
    time (``cluster_recovery_workers``) and asks the members of each at
    once, so that a look at many clusters ends within
    ``cluster_recovery_check_interval``; a look that does not is logged
    as a warning, since the primaries' leases may run out.
